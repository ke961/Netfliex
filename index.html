<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Intro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Authentic Netflix Audio Asset -->
    <audio id="ta-dum-audio" src="netflix-ta-dum.mp3" preload="auto"></audio>

    <!-- Start Overlay (Audio Policy Friendly) -->
    <div id="start-overlay" class="start-overlay">
        <div class="start-card">
            <div class="netflix-n-badge">
                <svg viewBox="0 0 180 280" class="mini-n-svg">
                    <path d="M 0,0 L 58,0 L 58,280 L 0,280 Z" fill="#E50914"/>
                    <path d="M 122,0 L 180,0 L 180,280 L 122,280 Z" fill="#E50914"/>
                    <path d="M 0,0 L 58,0 L 180,280 L 122,280 Z" fill="#B81D24"/>
                </svg>
            </div>
            <h1>NETFLIX</h1>
            <p>Click anywhere to play intro with the official "Ta-dum" sound</p>
            <button id="btn-start" class="btn-play">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                Play Intro
            </button>
        </div>
    </div>

    <!-- Main Intro Container -->
    <main id="netflix-intro" class="netflix-intro">
        <!-- Ambient Radial Red Background Glow -->
        <div class="glow-container">
            <div class="red-ambient-glow"></div>
            <div class="red-core-glow"></div>
        </div>

        <!-- Canvas for Spectrum Light Ribbons (Zoom Phase) -->
        <canvas id="spectrum-canvas"></canvas>

        <!-- Precision SVG Netflix 'N' Logo -->
        <div id="netflix-logo-box" class="netflix-logo-box">
            <svg class="n-logo-svg" viewBox="0 0 180 280" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Bottom Arch Curve Clip Path -->
                    <clipPath id="n-bottom-arch">
                        <path d="M 0,0 L 180,0 L 180,280 Q 90,266 0,280 Z" />
                    </clipPath>

                    <!-- Left Leg Gradient -->
                    <linearGradient id="grad-left-leg" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#E50914" />
                        <stop offset="65%" stop-color="#B81D24" />
                        <stop offset="100%" stop-color="#700000" />
                    </linearGradient>

                    <!-- Right Leg Gradient -->
                    <linearGradient id="grad-right-leg" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#E50914" />
                        <stop offset="65%" stop-color="#B81D24" />
                        <stop offset="100%" stop-color="#600000" />
                    </linearGradient>

                    <!-- Center Diagonal Gradient (Front Ribbon) -->
                    <linearGradient id="grad-center-leg" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF2630" />
                        <stop offset="35%" stop-color="#E50914" />
                        <stop offset="75%" stop-color="#B81D24" />
                        <stop offset="100%" stop-color="#400000" />
                    </linearGradient>

                    <!-- Drop Shadow Filter for Center Ribbon Fold -->
                    <filter id="center-shadow" x="-30%" y="-10%" width="160%" height="130%">
                        <feDropShadow dx="-10" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.9" />
                    </filter>
                </defs>

                <!-- Group with Bottom Curved Clip -->
                <g clip-path="url(#n-bottom-arch)">
                    <!-- 1. Left Vertical Leg -->
                    <path class="svg-leg svg-left" d="M 0,0 L 58,0 L 58,280 L 0,280 Z" fill="url(#grad-left-leg)" />

                    <!-- 2. Right Vertical Leg -->
                    <path class="svg-leg svg-right" d="M 122,0 L 180,0 L 180,280 L 122,280 Z" fill="url(#grad-right-leg)" />

                    <!-- 3. Center Diagonal Leg (Overlapping Front) -->
                    <path class="svg-leg svg-center" filter="url(#center-shadow)" d="M 0,0 L 58,0 L 180,280 L 122,280 Z" fill="url(#grad-center-leg)" />
                </g>
            </svg>
        </div>

        <!-- Floating Controls -->
        <div class="intro-controls">
            <button id="btn-mute" class="control-btn" title="Toggle Sound">
                <svg id="icon-unmuted" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg id="icon-muted" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" class="hidden">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
            <button id="btn-replay-intro" class="control-btn" title="Replay Intro">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
                <span>Replay</span>
            </button>
            <button id="btn-skip-intro" class="control-btn skip-pill" title="Skip Intro">
                <span>Skip Intro</span>
            </button>
        </div>
    </main>

    <!-- Post-Intro Destination (Netflix App UI) -->
    <div id="main-app" class="main-app hidden">
        <header class="netflix-header">
            <div class="nav-brand">NETFLIX</div>
            <nav class="nav-menu">
                <a href="#" class="active">Home</a>
                <a href="#">TV Shows</a>
                <a href="#">Movies</a>
                <a href="#">New & Popular</a>
                <a href="#">My List</a>
            </nav>
            <div class="nav-actions">
                <button id="btn-replay-nav" class="replay-nav-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                    </svg>
                    Replay Intro
                </button>
            </div>
        </header>

        <section class="profiles-container">
            <h1 class="whos-watching">Who's watching?</h1>
            <div class="profile-cards">
                <div class="profile-card" data-name="User">
                    <div class="avatar avatar-red">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profile Avatar" onerror="this.parentNode.innerHTML='<span style=\'font-size:36px;font-weight:bold;color:white;\'>N</span>'">
                    </div>
                    <span class="name">Primary</span>
                </div>
                <div class="profile-card" data-name="Guest">
                    <div class="avatar avatar-blue">
                        <span>G</span>
                    </div>
                    <span class="name">Guest</span>
                </div>
                <div class="profile-card" data-name="Kids">
                    <div class="avatar avatar-yellow">
                        <span>KIDS</span>
                    </div>
                    <span class="name">Kids</span>
                </div>
                <div class="profile-card add">
                    <div class="avatar avatar-add">
                        <svg viewBox="0 0 24 24" width="36" height="36" fill="currentColor">
                            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                        </svg>
                    </div>
                    <span class="name">Add Profile</span>
                </div>
            </div>
            <button class="manage-btn">Manage Profiles</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
